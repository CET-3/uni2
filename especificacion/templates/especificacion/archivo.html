{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="card surface-card">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <small class="text-muted">{{ ruta_relativa }}</small>
            <a href="{% url 'especificacion:indice' %}" class="btn btn-outline-primary btn-sm">← Índice</a>
        </div>
        <div class="contenido-especificacion" style="max-height:80vh; overflow-y:auto;">
            <style>
                .contenido-especificacion h1,
                .contenido-especificacion h2,
                .contenido-especificacion h3,
                .contenido-especificacion h4,
                .contenido-especificacion h5,
                .contenido-especificacion h6 {
                    font-size: inherit;
                    font-weight: bold;
                    margin: 1em 0 0.5em;
                }
            </style>
            {{ contenido_html|safe }}
        </div>
    </div>
</div>
{% endblock %}
