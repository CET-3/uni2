{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Uni2{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/beneficios.css' %}">
    <style>
        .app-panel-shell {
            display: grid;
            gap: 1.5rem;
        }

        .dashboard-hero {
            background: linear-gradient(135deg, #0d6efd 0%, #6ea8fe 100%);
            border: 0;
            border-radius: 1.5rem;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        .dashboard-hero::after {
            background: radial-gradient(circle at top right, rgba(255, 255, 255, 0.32), transparent 45%);
            content: "";
            inset: 0;
            pointer-events: none;
            position: absolute;
        }

        .dashboard-hero .card-body {
            padding: 1.75rem;
            position: relative;
            z-index: 1;
        }

        .dashboard-eyebrow {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .dashboard-actions-grid,
        .module-card-grid {
            display: grid;
            gap: 1rem;
        }

        .dashboard-actions-grid {
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        }

        .module-card-grid {
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .quick-action-card,
        .module-card,
        .info-card {
            border: 1px solid rgba(13, 110, 253, 0.12);
            border-radius: 1rem;
            box-shadow: 0 0.65rem 1.5rem rgba(15, 23, 42, 0.06);
        }

        .quick-action-card .card-body,
        .module-card .card-body,
        .info-card .card-body {
            padding: 1.25rem;
        }

        .sidebar-card {
            border: 1px solid rgba(13, 110, 253, 0.12);
            border-radius: 1.25rem;
            box-shadow: 0 0.65rem 1.5rem rgba(15, 23, 42, 0.06);
            top: 1.25rem;
        }

        .sidebar-card .list-group-item {
            align-items: center;
            border: 0;
            display: flex;
            font-weight: 500;
            gap: 0.75rem;
            justify-content: space-between;
            padding: 0.85rem 1.25rem;
        }

        .sidebar-card .list-group-item + .list-group-item {
            border-top: 1px solid rgba(15, 23, 42, 0.06);
        }

        .sidebar-card .list-group-item.active {
            background: rgba(13, 110, 253, 0.08);
            color: #0d6efd;
        }

        .metric-card {
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 0.65rem 1.5rem rgba(15, 23, 42, 0.06);
        }

        .metric-card .metric-label {
            color: #6c757d;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            margin-bottom: 0.35rem;
            text-transform: uppercase;
        }

        .metric-card .metric-value {
            font-size: 1.7rem;
            font-weight: 700;
            line-height: 1.05;
        }

        .section-card {
            border: 0;
            border-radius: 1.25rem;
            box-shadow: 0 0.65rem 1.5rem rgba(15, 23, 42, 0.06);
        }

        .section-card .card-body {
            padding: 1.5rem;
        }

        .section-title-row {
            align-items: center;
            display: flex;
            gap: 0.75rem;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .pill-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .dashboard-pill {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 999px;
            display: inline-flex;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.4rem 0.8rem;
        }

        .muted-kicker {
            color: #6c757d;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
        }

        .status-badge-soft {
            background: rgba(13, 110, 253, 0.08);
            border-radius: 999px;
            color: #0d6efd;
            display: inline-flex;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.35rem 0.7rem;
        }

        .compact-list li + li {
            margin-top: 0.75rem;
        }

        .page-header-actions,
        .mobile-stack-actions {
            display: flex;
            gap: 0.75rem;
        }

        .surface-card {
            border: 0;
            border-radius: 1.1rem;
            box-shadow: 0 0.65rem 1.5rem rgba(15, 23, 42, 0.06);
        }

        .admin-layout {
            display: grid;
            gap: 1.5rem;
        }

        .admin-main-column,
        .admin-side-column {
            display: grid;
            gap: 1.5rem;
            align-content: start;
        }

        .quick-action-meta {
            align-items: center;
            color: #6c757d;
            display: flex;
            font-size: 0.88rem;
            gap: 0.75rem;
            justify-content: space-between;
            margin: 0.9rem 0 1rem;
        }

        .quick-action-meta span:first-child {
            min-width: 0;
        }

        .support-link-list,
        .module-link-list {
            display: grid;
            gap: 0.75rem;
        }

        .support-link-item,
        .module-link-item {
            align-items: center;
            background: linear-gradient(180deg, #fff 0%, #f8fbff 100%);
            border: 1px solid rgba(13, 110, 253, 0.12);
            border-radius: 1rem;
            color: inherit;
            display: flex;
            gap: 1rem;
            justify-content: space-between;
            padding: 0.95rem 1rem;
            text-decoration: none;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .support-link-item:hover,
        .module-link-item:hover {
            border-color: rgba(13, 110, 253, 0.3);
            box-shadow: 0 0.8rem 1.8rem rgba(15, 23, 42, 0.08);
            transform: translateY(-1px);
        }

        .support-link-copy,
        .module-link-copy {
            min-width: 0;
        }

        .support-link-copy strong,
        .module-link-copy strong {
            display: block;
            font-size: 0.98rem;
        }

        .support-link-copy span,
        .module-link-copy span {
            color: #6c757d;
            display: block;
            font-size: 0.86rem;
            margin-top: 0.2rem;
        }

        .module-toggle {
            align-items: center;
            background: rgba(13, 110, 253, 0.08);
            border: 1px solid rgba(13, 110, 253, 0.12);
            border-radius: 1rem;
            color: #0d6efd;
            display: flex;
            font-weight: 600;
            justify-content: space-between;
            padding: 0.9rem 1rem;
            width: 100%;
        }

        .module-toggle[aria-expanded="true"] .module-toggle-label::after {
            content: "ocultar";
        }

        .module-toggle[aria-expanded="false"] .module-toggle-label::after {
            content: "mostrar";
        }

        .module-toggle-label::after {
            color: #6c757d;
            font-size: 0.82rem;
            font-weight: 500;
            margin-left: 0.45rem;
            text-transform: lowercase;
        }

        .table-soft thead th {
            color: #6c757d;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        @media (min-width: 992px) {
            .admin-layout {
                align-items: start;
                grid-template-columns: minmax(0, 1fr) 320px;
            }

            .admin-side-column {
                position: sticky;
                top: 1.25rem;
            }
        }

        @media (max-width: 991.98px) {
            .navbar .collapse.show,
            .navbar .collapse.collapsing {
                background: rgba(13, 110, 253, 0.98);
                border-radius: 1rem;
                margin-top: 0.75rem;
                padding: 1rem;
            }

            .navbar .collapse.show .d-flex,
            .navbar .collapse.collapsing .d-flex {
                flex-direction: column;
            }

            .dashboard-hero .card-body {
                padding: 1.25rem;
            }

            .dashboard-hero .display-6 {
                font-size: 2rem;
            }

            .app-panel-shell {
                gap: 1rem;
            }

            .page-header-actions,
            .mobile-stack-actions {
                flex-direction: column;
            }

            .page-header-actions .btn,
            .mobile-stack-actions .btn {
                width: 100%;
            }

            .module-toggle {
                margin-bottom: 0.9rem;
            }

            .table-soft {
                font-size: 0.92rem;
            }

            .surface-card .card-body,
            .section-card .card-body,
            .metric-card .card-body {
                padding: 1.15rem;
            }
        }

        @media (max-width: 575.98px) {
            main.py-4 {
                padding-top: 1rem !important;
            }

            .dashboard-hero {
                border-radius: 1.1rem;
            }

            .dashboard-hero .display-6 {
                font-size: 1.7rem;
            }

            .dashboard-actions-grid {
                grid-template-columns: 1fr;
            }

            .quick-action-meta {
                align-items: flex-start;
                flex-direction: column;
            }

            .table-soft {
                font-size: 0.88rem;
            }

            .table-soft td,
            .table-soft th {
                padding: 0.7rem 0.5rem;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    {% include "includes/navbar.html" %}
    <main class="py-4 flex-grow-1">
        <div class="container">
            {% include "includes/messages.html" %}
            {% block content %}{% endblock %}
        </div>
    </main>
    {% include "includes/footer.html" %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
