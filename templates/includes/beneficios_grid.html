{% if rubros_beneficio %}
<aside class="uni2-benefit-band" aria-labelledby="beneficios-title">
    <div class="uni2-section-heading">
        <div>
            <h2 id="beneficios-title">Club de Beneficios</h2>
        </div>
    </div>

    <div class="row g-3" aria-label="Rubros con beneficios">
        {% for rubro in rubros_beneficio %}
            <div class="col-6 col-md-3">
                <a href="{% url 'web:actividad_comercial_detalle' rubro.pk %}" class="uni2-benefit-mix-card {% cycle 'uni2-benefit-food' 'uni2-benefit-sport' 'uni2-benefit-beauty' 'uni2-benefit-fashion' %}">
                    <span class="uni2-benefit-logo-cloud" aria-hidden="true">
                        {% for comercio in rubro.comercios_con_foto|slice:":3" %}
                            {% if comercio.foto %}
                            <span class="uni2-benefit-logo-dot
                                {% if forloop.counter == 1 %}uni2-benefit-logo-dot-left
                                {% elif forloop.counter == 2 %}uni2-benefit-logo-dot-main
                                {% else %}uni2-benefit-logo-dot-right{% endif %}">
                                <img src="{{ comercio.foto.url }}" alt="{{ comercio.nombre }}" loading="lazy">
                            </span>
                            {% endif %}
                        {% endfor %}
                    </span>
                    <span class="uni2-benefit-rubric">{{ rubro.nombre }}</span>
                </a>
            </div>
        {% endfor %}
    </div>
</aside>
{% endif %}
