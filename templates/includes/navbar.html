<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="{% url 'web:home' %}">Uni2</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarUni2">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarUni2">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="{% url 'web:beneficios' %}">Beneficios</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'web:comercios' %}">Comercios</a></li>
            </ul>
            <div class="d-flex gap-2">
                {% if user.is_authenticated %}
                    {% if tiene_perfil_asociado %}
                        <a class="btn btn-outline-light btn-sm" href="{% url 'asociados:dashboard' %}">Mi panel</a>
                    {% endif %}
                    {% if tiene_gestion %}
                        <a class="btn btn-outline-light btn-sm" href="{% url 'gestion:dashboard' %}">Gestión</a>
                    {% endif %}
                    {% if tiene_perfil_comercio %}
                        <a class="btn btn-outline-light btn-sm" href="{% url 'comercios:dashboard' %}">Mi comercio</a>
                    {% endif %}
                    <form method="post" action="{% url 'usuarios:logout' %}">
                        {% csrf_token %}
                        <button class="btn btn-light btn-sm" type="submit">Salir</button>
                    </form>
                {% else %}
                    <a class="btn btn-light btn-sm" href="{% url 'usuarios:login' %}">Ingresar</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
