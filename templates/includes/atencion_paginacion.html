{% if page_obj.paginator.num_pages > 1 %}
<nav class="mt-3" aria-label="Páginas de resultados">
    <ul class="pagination mb-0 flex-wrap">
        {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?{{ querystring }}&amp;page={{ page_obj.previous_page_number }}"><i class="bi bi-chevron-left" aria-hidden="true"></i> Anterior</a></li>{% endif %}
        <li class="page-item disabled"><span class="page-link">{{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span></li>
        {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?{{ querystring }}&amp;page={{ page_obj.next_page_number }}">Siguiente <i class="bi bi-chevron-right" aria-hidden="true"></i></a></li>{% endif %}
    </ul>
</nav>
{% endif %}
