<section
    id="uni2-update-banner"
    class="uni2-pwa-update"
    aria-labelledby="uni2-update-title"
    role="status"
    aria-live="polite"
    aria-atomic="true"
    hidden
>
    <div>
        <h2 class="h6 mb-1" id="uni2-update-title">Hay una versión nueva de {{ pwa_short_name }}</h2>
        <p class="mb-0 small" data-pwa-update-message>Podés actualizarla ahora.</p>
    </div>
    <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-primary" id="uni2-update-apply" type="button">Actualizar ahora</button>
        <button class="btn btn-outline-primary" id="uni2-update-dismiss" type="button">Más tarde</button>
    </div>
</section>
