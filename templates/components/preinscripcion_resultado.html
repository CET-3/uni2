<div class="container py-4 py-md-5">
    <div class="uni2-preinscription-result-shell mx-auto">
        <article class="card uni2-surface-card uni2-surface-card-success uni2-preinscription-result" aria-labelledby="preinscripcion-result-title">
            <div class="card-body p-3 p-md-4">
                <header class="uni2-preinscription-result-header">
                    <span class="uni2-preinscription-result-icon" aria-hidden="true"><i class="bi bi-check-lg"></i></span>
                    <div>
                        <span class="uni2-badge uni2-badge-success">En revisión</span>
                        <h1 id="preinscripcion-result-title" class="uni2-titulo-componente mt-2 mb-0">{{ title }}</h1>
                    </div>
                </header>

                <p class="uni2-preinscription-result-message">{{ message }}</p>

                <div class="uni2-preinscription-result-notes">
                    <div class="uni2-preinscription-result-note">
                        <i class="bi bi-envelope-check" aria-hidden="true"></i>
                        <p>{{ email_note }}</p>
                    </div>
                    {% if process_note %}
                        <div class="uni2-preinscription-result-note">
                            <i class="bi bi-info-circle" aria-hidden="true"></i>
                            <p>{{ process_note }}</p>
                        </div>
                    {% endif %}
                </div>

                <div class="d-grid d-sm-block mt-4">
                    <a class="btn btn-primary" href="{% url 'web:home' %}"><i class="bi bi-house" aria-hidden="true"></i> Volver al inicio</a>
                </div>
            </div>
        </article>
    </div>
</div>
