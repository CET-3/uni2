{% url "web:home" as default_home_url %}
<nav class="uni2-breadcrumbs" aria-label="{{ aria_label|default:'Ruta de navegación' }}">
    <ol class="breadcrumb">
        <li class="breadcrumb-item">
            <a href="{{ home_url|default:default_home_url }}">{{ home_label|default:"Inicio" }}</a>
        </li>
        {% if parent_url and parent_label %}
            <li class="breadcrumb-item"><a href="{{ parent_url }}">{{ parent_label }}</a></li>
        {% endif %}
        <li class="breadcrumb-item active" aria-current="page">{{ current_label }}</li>
    </ol>
</nav>
