<nav class="uni2-breadcrumbs" aria-label="{{ aria_label|default:'Ruta de navegación' }}">
    <ol class="breadcrumb">
        {% if root_url and root_label %}
            <li class="breadcrumb-item">
                <a href="{{ root_url }}">{{ root_label }}</a>
            </li>
        {% endif %}
        {% if ancestor_url and ancestor_label %}
            <li class="breadcrumb-item">
                <a href="{{ ancestor_url }}">{{ ancestor_label }}</a>
            </li>
        {% endif %}
        {% if current_label %}
            <li class="breadcrumb-item active" aria-current="page">{{ current_label }}</li>
        {% endif %}
    </ol>
</nav>
