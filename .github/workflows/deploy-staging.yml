name: Deploy staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  tests:
    name: Validar antes de desplegar
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Vercel staging
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      PWA_BUILD_ID: ${{ github.sha }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_STAGING_TOKEN }}

    steps:
      - name: Descargar el commit aprobado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Instalar Vercel CLI
        run: npm install --global vercel@53.3.2

      - name: Desplegar sin mover el dominio estable
        id: deploy
        run: |
          deployment_url="$(
            vercel deploy \
              --prod \
              --skip-domain \
              --yes \
              --archive=tgz \
              --token="$VERCEL_TOKEN" \
              --build-env "PWA_BUILD_ID=$PWA_BUILD_ID" \
              --env "PWA_BUILD_ID=$PWA_BUILD_ID"
          )"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Probar seguridad, base, manifest y service worker
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          STAGING_ACCESS_PASSWORD: ${{ secrets.STAGING_ACCESS_PASSWORD }}
          STAGING_ACCESS_USERNAME: ${{ secrets.STAGING_ACCESS_USERNAME }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          bypass_args=(
            --fail
            --silent
            --show-error
            --retry 5
            --retry-all-errors
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"
          )
          anonymous_status="$(
            curl "${bypass_args[@]}" "$DEPLOYMENT_URL/" \
              --output /dev/null \
              --write-out "%{http_code}" \
              --fail-with-body 2>/dev/null || true
          )"
          test "$anonymous_status" = "401"

          common_args=(
            "${bypass_args[@]}"
            --user "$STAGING_ACCESS_USERNAME:$STAGING_ACCESS_PASSWORD"
          )
          curl "${common_args[@]}" "$DEPLOYMENT_URL/__staging__/readiness/" \
            --output /tmp/readiness.json
          python -c 'import json, os; data=json.load(open("/tmp/readiness.json")); assert data["ready"] is True; assert data["build_id"] == os.environ["PWA_BUILD_ID"]'
          curl "${common_args[@]}" "$DEPLOYMENT_URL/manifest.webmanifest" \
            --dump-header /tmp/manifest.headers \
            --output /tmp/manifest.json
          python -c 'import json; data=json.load(open("/tmp/manifest.json")); assert data["short_name"] == "UNI2 STG"; assert "/staging/" in data["icons"][0]["src"]'
          python -c 'headers=open("/tmp/manifest.headers").read().lower(); assert "application/manifest+json" in headers; assert "x-robots-tag: noindex" in headers; assert "cache-control: private, no-store" in headers'
          python -c 'import json; [print(icon["src"], icon["sizes"]) for icon in json.load(open("/tmp/manifest.json"))["icons"]]' |
          while read -r icon_path expected_size; do
            curl "${common_args[@]}" "$DEPLOYMENT_URL$icon_path" --output /tmp/staging-icon.png
            python -c 'import struct, sys; data=open("/tmp/staging-icon.png", "rb").read(24); assert data[:8] == b"\x89PNG\r\n\x1a\n"; width, height=struct.unpack(">II", data[16:24]); assert f"{width}x{height}" == sys.argv[1]' "$expected_size"
          done
          curl "${common_args[@]}" "$DEPLOYMENT_URL/service-worker.js" \
            --dump-header /tmp/service-worker.headers \
            --output /tmp/service-worker.js
          python -c 'import json, os; ready=json.load(open("/tmp/readiness.json")); worker=open("/tmp/service-worker.js").read(); assert "const BUILD_ID = " + json.dumps(os.environ["PWA_BUILD_ID"]) + ";" in worker; assert "const DATA_EPOCH = " + json.dumps(ready["data_epoch"]) + ";" in worker'
          python -c 'headers=open("/tmp/service-worker.headers").read().lower(); assert "service-worker-allowed: /" in headers; assert "cache-control: private, no-store" in headers'
          curl "${common_args[@]}" "$DEPLOYMENT_URL/sin-conexion/" --output /tmp/offline.html
          python -c 'html=open("/tmp/offline.html").read(); assert "STAGING · DATOS REALES" in html'

      - name: Promover el deployment aprobado
        run: vercel promote "${{ steps.deploy.outputs.url }}" --yes --token="$VERCEL_TOKEN"

      - name: Verificar el dominio estable promovido
        env:
          STAGING_ACCESS_PASSWORD: ${{ secrets.STAGING_ACCESS_PASSWORD }}
          STAGING_ACCESS_USERNAME: ${{ secrets.STAGING_ACCESS_USERNAME }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$STAGING_BASE_URL"
          common_args=(
            --fail
            --silent
            --show-error
            --retry 5
            --retry-all-errors
            --user "$STAGING_ACCESS_USERNAME:$STAGING_ACCESS_PASSWORD"
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"
          )
          curl "${common_args[@]}" "$STAGING_BASE_URL/__staging__/readiness/" \
            --output /tmp/stable-readiness.json
          python -c 'import json, os; data=json.load(open("/tmp/stable-readiness.json")); assert data["ready"] is True; assert data["build_id"] == os.environ["PWA_BUILD_ID"]'
