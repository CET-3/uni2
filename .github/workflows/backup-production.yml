name: Backup de producción

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar uv y Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Crear copia cifrada y verificarla en R2
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          R2_BUCKET: uni2-backup
          R2_ENDPOINT: ${{ secrets.BACKUP_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: uv run --frozen python scripts/backup_production.py
      - name: Copiar imágenes y verificar cada objeto en R2
        env:
          R2_ENDPOINT: ${{ secrets.BACKUP_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          MEDIA_R2_ACCESS_KEY_ID: ${{ secrets.MEDIA_R2_ACCESS_KEY_ID }}
          MEDIA_R2_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_R2_SECRET_ACCESS_KEY }}
        run: uv run --frozen python scripts/backup_media.py
      - name: Registrar fallo del backup
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Falló el backup de producción" --body "Revisar $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
